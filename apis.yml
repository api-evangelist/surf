aid: surf
name: Surf
description: 'Surf (asksurf.ai) is a crypto-focused AI research and execution platform that
  exposes its intelligence as a developer API. The Surf Data API ("Hermod" gateway) provides
  119 typed REST endpoints across 14 domains — exchange and market data, tokens, DeFi projects,
  wallets, on-chain SQL, social signals, news, funds, prediction markets (Polymarket/Kalshi),
  Hyperliquid perps, search, and web fetch — covering 40+ blockchains and 200+ data sources.
  A separate OpenAI-style Chat API (surf-2.0 / surf-2.0-instant models) answers natural-language
  crypto research questions with citations. Access is via a single Bearer API key with
  credit-based billing (30 free credits/day, no signup), and the platform ships a Go CLI, an
  MCP server, an Agent Skill, and a TypeScript SDK. Surf is backed by Pantera Capital.'
