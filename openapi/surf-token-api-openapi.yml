      type: object
    TransferSeriesPoint:
      additionalProperties: false
      properties:
        amount:
          description: Decimal-adjusted token amount transferred on this day.
          type: string
        amount_usd:
          description: Summed USD value for the day. Absent when the day is not yet USD-priced.
          format: double
          type: number
        date:
          description: Start-of-day Unix seconds (UTC).
          format: int64
          type: integer
        enriched_ratio:
          description: Fraction of the day's transfers with a USD price (0..1).
          format: double
          type: number
        transfer_count:
          description: Transfers on this day.
          format: int64
          type: integer
      required:
      - date
      - transfer_count
      - amount
      type: object
    TransferStatsMeta:
      additionalProperties: false
      properties:
        cached:
          description: Whether this response was served from cache
          type: boolean
        credits_used:
          description: Credits deducted for this request
          format: int64
          type: integer
        empty_reason:
          description: Hint explaining why the data object is empty, when applicable
          type: string
        enriched_ratio:
          description: Fraction of transfers with a USD price (0..1). Low/zero means USD-value fields are partial.
          format: double
          type: number
      required:
      - credits_used
      - cached
      type: object
    TransferStatsBody:
      additionalProperties: false
      properties:
        enriched_ratio:
          description: Fraction of transfers with a USD price (0..1). Low/zero on recent windows where USD pricing lags ~3 days.
          format: double
          type: number
        first_transfer_at:
          description: Unix seconds of the first transfer in the window (0 if none).
          format: int64
          type: integer
        last_transfer_at:
          description: Unix seconds of the last transfer in the window (0 if none).
          format: int64
          type: integer
        series:
          description: Daily breakdown, newest first. Present only when include=series.
          items:
            $ref: '#/components/schemas/TransferSeriesPoint'
          type:
          - array
          - 'null'
        total_amount:
          description: Decimal-adjusted total token amount transferred.
          type: string
        total_amount_usd:
          description: Summed USD value. Absent when nothing in the window is USD-priced.
          format: double
          type: number
        total_transfers:
          description: Total transfers in the window.
          format: int64
          type: integer
        unique_receivers:
          description: Approximate distinct receivers (uniq, ~1% error).
          format: int64
          type: integer
        unique_senders:
          description: Approximate distinct senders (uniq, ~1% error).
          format: int64
          type: integer
      required:
      - total_transfers
      - unique_senders
      - unique_receivers
      - total_amount
      - first_transfer_at
      - last_transfer_at
      type: object
