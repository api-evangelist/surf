      required:
      - data
      - meta
      type: object
    TokenTransferItem:
      additionalProperties: false
      properties:
        amount:
          description: Transfer amount (decimal-adjusted, human-readable)
          type: string
        amount_usd:
          description: Transfer value in USD at the time of the transaction. Not available for all transfers.
          format: double
          type: number
        block_number:
          description: Block number in which this transfer was included
          format: int64
          type: integer
        from_address:
          description: Sender wallet address
          type: string
        from_label:
          $ref: '#/components/schemas/WalletLabelItem'
          description: Entity labels for from_address. Only present when the request sets `include=labels`.
        symbol:
          description: Token symbol like ETH, USDC, or WETH
          type: string
        timestamp:
          description: Unix timestamp in seconds when the transfer occurred
          format: int64
          type: integer
        to_address:
          description: Recipient wallet address
          type: string
        to_label:
          $ref: '#/components/schemas/WalletLabelItem'
          description: Entity labels for to_address. Only present when the request sets `include=labels`.
        tx_hash:
          description: Transaction hash
          type: string
      required:
      - tx_hash
      - from_address
      - to_address
      - amount
      - timestamp
      - block_number
      type: object
    TokenUnlockAllocationItem:
      additionalProperties: false
      properties:
        amount:
          description: Decimal-adjusted allocation amount
          format: double
          type: number
        name:
          description: Allocation name
          type: string
      required:
      - name
      - amount
      type: object
