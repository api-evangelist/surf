      - description: Fuzzy entity name search. Only use when 'id' is not available. May return unexpected results for ambiguous names.
        explode: false
        in: query
        name: q
        schema:
          description: Fuzzy entity name search. Only use when 'id' is not available. May return unexpected results for ambiguous names.
          examples:
          - ethereum
