  /gateway/v1/prediction-market/polymarket/volume-split/{condition_id}:
    get:
      description: 'Volume split by YES/NO outcome sides per interval (hour/day/week), plus total volume and trade count.

        Use this to see directional volume bias.

        For aggregate volume without YES/NO breakdown, use `volumes` instead.


        Data refresh: ~30 minutes'
      operationId: polymarket-volume-split
      parameters:
      - description: Polymarket condition ID
        in: path
        name: condition_id
        required: true
        schema:
          description: Polymarket condition ID
          examples:
          - '0x6fefc0438c7598b23531457c8c60541990d0786bd4bd9dfc3eabc8d95c291092'
          type: string
      - description: Time granularity for volume aggregation
        explode: false
        in: query
        name: granularity
        schema:
          default: hour
          description: Time granularity for volume aggregation
          enum:
          - hour
          - day
          - week
          type: string
      - description: Start time (Unix seconds). 0 means no lower bound. Cache aligns to 5-minute buckets, so two requests within the same bucket return the same cached result.
        explode: false
        in: query
        name: start_time
        schema:
          description: Start time (Unix seconds). 0 means no lower bound. Cache aligns to 5-minute buckets, so two requests within the same bucket return the same cached result.
          format: int64
          minimum: 0
          type: integer
      - description: End time (Unix seconds). 0 means current time. Cache aligns to 5-minute buckets, so two requests within the same bucket return the same cached result.
        explode: false
        in: query
        name: end_time
        schema:
          description: End time (Unix seconds). 0 means current time. Cache aligns to 5-minute buckets, so two requests within the same bucket return the same cached result.
          format: int64
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2VolumeChartResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAPIError'
          description: Error
      security:
      - AccessToken: []
      summary: Polymarket Volume Split (YES/NO)
      tags:
      - Prediction Market
  /gateway/v1/prediction-market/polymarket/volumes:
    get:
      description: 'Aggregate trading volume (USD) and trade count as a time series.

        Use this for volume trend analysis.

        For YES/NO volume breakdown by outcome side, use `volume-split` instead.


        **Data refresh:** ~30 minutes'
      operationId: polymarket-volumes
      parameters:
      - description: Market condition identifier (required if token_id not provided)
        explode: false
        in: query
        name: condition_id
        schema:
          description: Market condition identifier (required if token_id not provided)
          examples:
          - '0x6fefc0438c7598b23531457c8c60541990d0786bd4bd9dfc3eabc8d95c291092'
          type: string
      - description: Token ID (alternative identifier, resolved to condition_id internally)
        explode: false
        in: query
        name: token_id
        schema:
          description: Token ID (alternative identifier, resolved to condition_id internally)
          type: string
      - description: 'Window of history to return (how much data, from now backward): `7d`, `30d`, `90d`, `180d`, or `1y`. Distinct from `interval` (which sets bucket size within the window).'
        explode: false
        in: query
        name: time_range
        schema:
          default: 30d
          description: 'Window of history to return (how much data, from now backward): `7d`, `30d`, `90d`, `180d`, or `1y`. Distinct from `interval` (which sets bucket size within the window).'
          enum:
          - 7d
          - 30d
          - 90d
          - 180d
          - 1y
          examples:
          - 30d
          type: string
      - description: 'Bucket size for each point in the returned series: `1h` (hourly) or `1d` (daily). Distinct from `time_range` (which sets the window size).'
        explode: false
        in: query
        name: interval
        schema:
          default: 1d
          description: 'Bucket size for each point in the returned series: `1h` (hourly) or `1d` (daily). Distinct from `time_range` (which sets the window size).'
          enum:
          - 1h
          - 1d
          examples:
          - 1d
          type: string
      - description: Aggregation granularity (alternative to interval). When provided, queries daily table with buy/sell volume breakdown.
        explode: false
        in: query
        name: granularity
        schema:
          description: Aggregation granularity (alternative to interval). When provided, queries daily table with buy/sell volume breakdown.
          enum:
          - day
          - week
          - month
          - year
          - all
          type: string
      - description: Start time as Unix seconds (alternative to time_range)
        explode: false
        in: query
        name: start_time
        schema:
          description: Start time as Unix seconds (alternative to time_range)
          format: int64
          type: integer
      - description: End time as Unix seconds (alternative to time_range)
        explode: false
        in: query
        name: end_time
        schema:
          description: End time as Unix seconds (alternative to time_range)
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponsePolymarketVolumePoint'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAPIError'
          description: Error
      security:
      - AccessToken: []
      summary: Polymarket Volume History
      tags:
      - Prediction Market
