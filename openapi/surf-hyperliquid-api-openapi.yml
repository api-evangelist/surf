    HyperliquidPerformanceView:
      additionalProperties: false
      properties:
        account_value:
          description: Live PERP clearinghouse equity, USD (from the snapshot) — not total portfolio (spot/vault excluded; see /hyperliquid/account.total_value_usd). A genuinely flat/empty perp account returns 0 with NO errors[] entry; the field is OMITTED only when the snapshot section degraded (which also adds an errors[] entry) — so detect degradation via errors[], not a 0 value.
          format: double
          type: number
        address:
          description: Wallet address (lowercased)
          type: string
        errors:
          description: Sections whose fetch failed (gap_fill, snapshot, ledger); omitted when everything succeeded
          items:
            $ref: '#/components/schemas/HyperliquidSectionError'
          type:
          - array
          - 'null'
        open_positions:
          description: Live open positions from the clearinghouse snapshot (empty when the snapshot section degraded — see errors[])
          items:
            $ref: '#/components/schemas/HyperliquidPosition'
          type:
          - array
          - 'null'
        partial:
          description: true when one or more upstream sections degraded (= errors[] is non-empty); the present sections are still returned
          type: boolean
        performance:
          $ref: '#/components/schemas/HyperliquidWalletPerf'
          description: Lifetime performance re-rolled over the warehouse aggregate + the live gap-fill tail; omitted when the wallet has never traded. A lower bound when errors[] contains gap_fill (the live tail was truncated or unavailable).
        total_unrealized_pnl:
          description: Sum of unrealized PnL across the live open positions, USD. Omitted when the snapshot section degraded (see errors[]); 0 for a flat account.
          format: double
          type: number
        traded_pairs:
          description: Distinct markets this wallet has closed trades in (warehouse + live tail), e.g. for a breadth badge. 0 when the wallet has never traded.
          format: int64
          type: integer
        watermark:
          description: Warehouse episode watermark = the boundary the live gap-fill resumes from (Unix SECONDS); 0 means full backfill
          format: int64
          type: integer
      required:
      - address
      - open_positions
      - traded_pairs
      - watermark
      - partial
      type: object
    CursorMeta:
      additionalProperties: false
