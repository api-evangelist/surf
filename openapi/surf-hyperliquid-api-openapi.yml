  /gateway/v1/hyperliquid/trades:
    get:
      description: 'Returns a wallet''s closed round-trip trades — one row per open→close position lifecycle, with realized per-trade P&L (gross, net = gross − fees, fees, and `funding_pnl` as a **separate** field that net EXCLUDES), entry/exit price, size, and hold time. Newest close first. This is the journal / calendar / attribution source; for fill-level executions use `/hyperliquid/fills` instead.


        Returns EVERY closed trade in the window — it does NOT filter by symbol or direction (a `symbol`/`direction` query param is ignored, not applied); for per-symbol / per-direction rollups use `/hyperliquid/trades/aggregate`, or `/hyperliquid/fills` for symbol-scoped fills. `funding_pnl` is 0 for warehouse rows and populated only on the live tail, so a funding-inclusive total is incomplete before the watermark.


        Cursor-paged over the full history (warehouse + a live gap-fill for the most recent days): follow `meta.next_cursor` to page back. The cursor is a complete continuation token (it encodes the window + position), so pass it with only `address` and `limit` — combining it with `from`/`to` is rejected. `from`/`to` (Unix seconds or a date) bound the window on the first page. A wallet with an extremely large live (post-warehouse) trade history may require a `from`/`to` window.'
      operationId: hyperliquid-trades
      parameters:
      - description: 'Wallet address: a 0x EVM address or an ENS name (e.g. vitalik.eth). Solana addresses are not supported.'
        explode: false
        in: query
        name: address
        required: true
        schema:
          description: 'Wallet address: a 0x EVM address or an ENS name (e.g. vitalik.eth). Solana addresses are not supported.'
          type: string
      - description: NOT SUPPORTED on /trades — returns 400 if set. Per-symbol slicing lives on /trades/aggregate (group_by=symbol) or client-side.
        explode: false
        in: query
        name: symbol
        schema:
          description: NOT SUPPORTED on /trades — returns 400 if set. Per-symbol slicing lives on /trades/aggregate (group_by=symbol) or client-side.
          type: string
      - description: NOT SUPPORTED on /trades — returns 400 if set. Per-direction slicing lives on /trades/aggregate (group_by=direction) or client-side.
        explode: false
        in: query
        name: direction
        schema:
          description: NOT SUPPORTED on /trades — returns 400 if set. Per-direction slicing lives on /trades/aggregate (group_by=direction) or client-side.
          enum:
          - long
          - short
          type: string
      - description: NOT SUPPORTED on /trades — returns 400 if set. Market scoping lives on /trades/aggregate (dex=...).
        explode: false
        in: query
        name: dex
        schema:
          description: NOT SUPPORTED on /trades — returns 400 if set. Market scoping lives on /trades/aggregate (dex=...).
          type: string
      - description: 'Window start: Unix seconds, an ISO datetime (2026-03-01T12:00:00Z), or a bare date (= midnight UTC). Omit for the full history.'
        explode: false
        in: query
        name: from
        schema:
          description: 'Window start: Unix seconds, an ISO datetime (2026-03-01T12:00:00Z), or a bare date (= midnight UTC). Omit for the full history.'
          examples:
          - '2026-03-01'
          type: string
      - description: 'Window end, inclusive: Unix seconds, an ISO datetime, or a bare date — a bare date means the END of that UTC day, so from=X&to=X covers the whole day X. Defaults to now.'
        explode: false
        in: query
        name: to
        schema:
          description: 'Window end, inclusive: Unix seconds, an ISO datetime, or a bare date — a bare date means the END of that UTC day, so from=X&to=X covers the whole day X. Defaults to now.'
          examples:
          - '2026-03-01'
          type: string
      - description: 'Opaque continuation token from a previous response''s meta.next_cursor. It encodes the window, position, and address, so pass it with only address + limit — and only with the address it was issued for. Tokens are single-use opaque values: identical requests mint different tokens that decode to the same position.'
        explode: false
        in: query
        name: cursor
        schema:
          description: 'Opaque continuation token from a previous response''s meta.next_cursor. It encodes the window, position, and address, so pass it with only address + limit — and only with the address it was issued for. Tokens are single-use opaque values: identical requests mint different tokens that decode to the same position.'
          type: string
      - description: Page size (1-100).
        explode: false
        in: query
        name: limit
        schema:
          default: 20
          description: Page size (1-100).
          format: int64
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorDataResponseHyperliquidEpisode'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAPIError'
          description: Error
      security:
      - AccessToken: []
      summary: Closed Trades
      tags:
      - Hyperliquid
  /gateway/v1/hyperliquid/trades/aggregate:
    get:
      description: 'Returns a wallet''s closed trades rolled up server-side into one row per group — so the P&L calendar, per-symbol / direction / size attribution, and the realized equity curve are one call each instead of paging the whole trade history.


        **`group_by`:** `day` (UTC calendar day — the calendar and equity-curve source), `symbol` (per market), `direction` (long vs short), `size_bucket` (notional-USD tiers: `<1k`, `1k-10k`, `10k-100k`, `100k-1m`, `1m+`), or `hold_bucket` (holding-time tiers: `<5m`, `5m-1h`, `1h-1d`, `1d-1w`, `1w+`). Tiers with no trades are omitted — render the full ladder client-side and zero-fill. One dimension per call.


        **Per group:** trade_count, gross_pnl, net_pnl (funding-excluded — gross − fees, matching `/trades` and `/performance`), fees, funding_pnl (live tail only), win_rate, volume_usd (notional), avg_win, avg_loss.


        `from`/`to` (Unix seconds or a date) bound close_time; omit for full history. Totals reconcile to `/trades` and `/performance` — all three read the same `episodes` universe (warehouse ≤ watermark plus the live gap-fill past it) through one shared watermark; only the live gap-fill contributes trades past the watermark, and `funding_pnl` is populated on that tail alone. `dex` scopes to one market (omit to aggregate across markets). For `group_by=day`, `fill_gaps=true` emits zero rows for no-trade days (a dense calendar; requires `from`). Not paginated — every group in the window is returned in one response.'
      operationId: hyperliquid-trades-aggregate
      parameters:
      - description: 'Wallet address: a 0x EVM address or an ENS name (e.g. vitalik.eth). Solana addresses are not supported.'
        explode: false
        in: query
        name: address
        required: true
        schema:
          description: 'Wallet address: a 0x EVM address or an ENS name (e.g. vitalik.eth). Solana addresses are not supported.'
          type: string
      - description: Dimension to roll up by. day = UTC calendar day (the P&L calendar / equity-curve source); symbol = per market; direction = long vs short; size_bucket = notional-USD tiers; hold_bucket = holding-time tiers.
        explode: false
        in: query
        name: group_by
        schema:
          default: day
          description: Dimension to roll up by. day = UTC calendar day (the P&L calendar / equity-curve source); symbol = per market; direction = long vs short; size_bucket = notional-USD tiers; hold_bucket = holding-time tiers.
          enum:
          - day
          - symbol
          - direction
          - size_bucket
          - hold_bucket
          type: string
      - description: 'Window start, bounds close_time: Unix seconds, an ISO datetime (2026-03-01T12:00:00Z), or a bare date (= midnight UTC). Omit for full history.'
        explode: false
        in: query
        name: from
        schema:
          description: 'Window start, bounds close_time: Unix seconds, an ISO datetime (2026-03-01T12:00:00Z), or a bare date (= midnight UTC). Omit for full history.'
          examples:
          - '2026-03-01'
          type: string
      - description: 'Window end, inclusive, bounds close_time: Unix seconds, an ISO datetime, or a bare date — a bare date means the END of that UTC day, so from=X&to=X covers the whole day X. Defaults to now.'
        explode: false
        in: query
        name: to
        schema:
          description: 'Window end, inclusive, bounds close_time: Unix seconds, an ISO datetime, or a bare date — a bare date means the END of that UTC day, so from=X&to=X covers the whole day X. Defaults to now.'
          examples:
          - '2026-03-31'
          type: string
      - description: 'Market scope: main_dex for the native market only, omit to aggregate across ALL markets, or a builder market — one of: xyz, flx, vntl, hyna, km, abcd, cash, para, mkts. NOTE: the omit default differs from /leaderboard, where omitting dex means the native market only.'
        explode: false
        in: query
        name: dex
        schema:
          description: 'Market scope: main_dex for the native market only, omit to aggregate across ALL markets, or a builder market — one of: xyz, flx, vntl, hyna, km, abcd, cash, para, mkts. NOTE: the omit default differs from /leaderboard, where omitting dex means the native market only.'
          enum:
          - main_dex
          - xyz
          - flx
          - vntl
          - hyna
          - km
          - abcd
          - cash
          - para
          - mkts
          type: string
      - description: 'group_by=day only: emit a zero row for every no-trade UTC day in the window so the calendar is dense. Requires from (a bounded window); ignored for other group_by values.'
        explode: false
        in: query
        name: fill_gaps
        schema:
          default: false
          description: 'group_by=day only: emit a zero row for every no-trade UTC day in the window so the calendar is dense. Requires from (a bounded window); ignored for other group_by values.'
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseHyperliquidTradeGroup'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAPIError'
          description: Error
      security:
      - AccessToken: []
      summary: Closed Trades Aggregate
      tags:
      - Hyperliquid
components:
  schemas:
    OffsetMeta:
      additionalProperties: false
      properties:
        cached:
          description: Whether this response was served from cache
          type: boolean
        credits_used:
          description: Credits deducted for this request
          format: int64
          type: integer
        empty_reason:
          description: Hint explaining why the data array is empty, when applicable
          type: string
        has_more:
          description: Whether more items may exist beyond this response. For offset-paged endpoints, continue with a larger offset. For time-series endpoints without offset/cursor controls, true means the requested time range hit an upstream cap; narrow from/to to continue. Omitted when exhaustion cannot be proven.
          type: boolean
        limit:
          description: Maximum number of items returned in this response
          format: int64
          type: integer
        offset:
          description: Number of items skipped (pagination offset)
          format: int64
          type: integer
        total:
          description: Total number of matching items (before pagination). Omitted when total is unknown.
          format: int64
          type: integer
        watermark:
          description: Warehouse watermark (Unix seconds) this response was computed at, on warehouse-backed endpoints (e.g. Hyperliquid /trades/aggregate) — rows up to this time come from the warehouse, newer rows from the live tail. Omitted elsewhere.
          format: int64
          type: integer
      required:
      - limit
      - offset
      - credits_used
      - cached
      type: object
    CursorDataResponseHyperliquidEpisode:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://example.com/schemas/CursorDataResponseHyperliquidEpisode.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: '#/components/schemas/HyperliquidEpisode'
          type:
          - array
          - 'null'
        meta:
          $ref: '#/components/schemas/CursorMeta'
      required:
      - data
      - meta
      type: object
    ObjectResponseMeta:
      additionalProperties: false
      properties:
        cached:
          description: Whether this response was served from cache
          type: boolean
        credits_used:
          description: Credits deducted for this request
          format: int64
          type: integer
        empty_reason:
          description: Hint explaining why the data array is empty, when applicable
          type: string
      required:
      - credits_used
      - cached
      type: object
    DataAPIError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
          - https://example.com/schemas/DataAPIError.json
          format: uri
          readOnly: true
          type: string
        error:
          $ref: '#/components/schemas/DataAPIErrorDetail'
      required:
      - error
      type: object
    HyperliquidEpisode:
      additionalProperties: false
      properties:
        close_time:
          description: When the position fully closed (Unix seconds)
          format: int64
          type: integer
        direction:
          description: long or short (side of the opening leg)
          type: string
        entry_px:
          description: Size-weighted average entry price, USD
          format: double
          type: number
        episode_id:
          description: Stable per-wallet episode id (the opening fill's trade id). Present on warehouse rows; OMITTED on live-tail rows (assigned when the episode lands in the warehouse) — dedup live rows by (symbol, open_time, close_time) until then.
          type: string
        exit_px:
          description: Size-weighted average exit price, USD
          format: double
          type: number
        fees:
          description: Fees paid over the episode, USD
          format: double
          type: number
        funding_pnl:
          description: Funding paid/received over the episode, USD (positive = received). A separate field — net_pnl EXCLUDES funding. 0 for warehouse rows (pre-watermark), populated only on the live tail, so a funding-inclusive sum is incomplete before the watermark.
          format: double
          type: number
        gross_pnl:
          description: Realized PnL before fees, USD
          format: double
          type: number
        hold_seconds:
          description: Duration the position was held, seconds
          format: int64
          type: integer
        is_win:
          description: net_pnl > 0
          type: boolean
        net_pnl:
          description: Realized PnL after fees, USD (funding excluded — gross_pnl − fees)
          format: double
          type: number
        notional_usd:
          description: Opened notional, USD (opened_sz × entry_px) — the size figure /trades/aggregate's volume_usd sums
          format: double
          type: number
        open_time:
          description: When the position opened (Unix seconds)
          format: int64
          type: integer
        opened_sz:
          description: Total size opened over the episode (token units)
          format: double
          type: number
        source:
          description: warehouse (from the ClickHouse build) or live (Hydromancer gap-fill past the warehouse watermark)
          type: string
        symbol:
          description: Market id the trade was in (BTC, kPEPE, xyz:GOLD)
          type: string
      required:
      - symbol
      - direction
      - open_time
      - close_time
      - opened_sz
      - entry_px
      - exit_px
      - gross_pnl
      - net_pnl
      - fees
      - funding_pnl
      - is_win
      - hold_seconds
      - source
      - notional_usd
      type: object
    HyperliquidTraderStats:
      additionalProperties: false
      properties:
        account_age_days:
          description: Account age in days (lifetime). Omitted when the trader has no fills on record.
          format: int64
          type: integer
        address:
          description: Wallet address
          type: string
        days_active:
