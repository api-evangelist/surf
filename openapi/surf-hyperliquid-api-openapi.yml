          description: Stable unique identifier for this fill. Pass the oldest fill's value back as to_fill_id (alongside its time_ms as to_ms) to page losslessly, and use it to de-duplicate fills across pages — time and hash are NOT unique (many fills can share a second and an on-chain hash).
          type: string
        hash:
          description: On-chain transaction hash (the zero hash when is_internal is true). NOT unique per fill — one transaction can settle many fills.
          type: string
        is_internal:
          description: true for fills not tied to a standard on-chain order (zero transaction hash)
          type: boolean
        price:
          description: Fill price
          format: double
          type: number
        side:
          description: buy or sell
          type: string
        size:
          description: Amount filled
          format: double
          type: number
        start_position:
          description: Position size before this fill
          format: double
          type: number
        symbol:
          description: Market id
          type: string
        time:
          description: When it filled (Unix seconds). Second-granular; use time_ms for precise ordering and for paging via to_ms.
          format: int64
          type: integer
        time_ms:
          description: When it filled (Unix milliseconds). Use for precise ordering/dedup; pass the oldest value back as to_ms (paired with its fill_id as to_fill_id) to page to the next page without losing fills.
          format: int64
          type: integer
