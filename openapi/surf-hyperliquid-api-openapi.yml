          description: When the account sections were fetched upstream (Unix seconds) — for a cached response this predates the response time by up to the cache TTL
          format: int64
          type: integer
        errors:
          description: Sections whose fetch failed; omitted when everything succeeded
          items:
            $ref: '#/components/schemas/HyperliquidSectionError'
          type:
          - array
          - 'null'
        perp:
          $ref: '#/components/schemas/HyperliquidPerpSummary'
          description: Perps summary; omitted if the fetch failed (see errors[])
        spot:
          $ref: '#/components/schemas/HyperliquidSpot'
          description: Spot balances; omitted if the fetch failed (see errors[])
        staking:
          $ref: '#/components/schemas/HyperliquidStaking'
          description: HYPE staking; omitted if the fetch failed (see errors[])
        total_value_usd:
          description: 'Best-effort total account value, USD: perp equity + vault equity + staked HYPE + spot holdings that have a market price (USDC, stablecoins, and HYPE). Excludes spot tokens with no market price (counted in unpriced_token_count) — so when unpriced_token_count is 0 this is the complete account value, otherwise a lower bound. Omitted when any account section (perp, spot, vaults, staking) failed to load, or when HYPE is held but its price could not be fetched (see errors[]) — so a present value always covers every section.'
          format: double
          type: number
        unpriced_token_count:
          description: Number of held spot tokens that have no market price and are therefore excluded from total_value_usd. 0 means total_value_usd is complete; greater than 0 means it is a lower bound (the excluded tokens are typically small, illiquid spot tokens).
          format: int64
          type: integer
        vaults:
          $ref: '#/components/schemas/HyperliquidVaults'
          description: Vault equity; omitted if the fetch failed (see errors[])
      required:
      - as_of
      - unpriced_token_count
      - address
      type: object
