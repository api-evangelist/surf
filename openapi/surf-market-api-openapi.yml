  /gateway/v1/market/price:
    get:
      description: 'Returns historical price data points for a token over a specified time range.


        **Time range options:**

        - Predefined: `1d`, `7d`, `14d`, `30d`, `90d`, `180d`, `365d`, `max`

        - Custom: use `from` / `to` (Unix seconds or `YYYY-MM-DD`)


        **Granularity** is automatic based on range:

        - `1d` → 5-minute intervals

        - `7d`–`90d` → hourly

        - `180d`+ → daily'
      operationId: market-price
      parameters:
      - description: Single token ticker symbol like `BTC`, `ETH`, or `SOL` (multi-symbol not supported)
        explode: false
        in: query
        name: symbol
        required: true
        schema:
          description: Single token ticker symbol like `BTC`, `ETH`, or `SOL` (multi-symbol not supported)
          examples:
          - BTC
          type: string
      - description: 'Window of historical data to return: `1d`, `7d`, `14d`, `30d`, `90d`, `180d`, `365d`, or `max`. Ignored when `from`/`to` are set. This endpoint uses `time_range` only — it does NOT accept `interval`; bucket granularity is chosen server-side based on the window size.'
        explode: false
        in: query
        name: time_range
        schema:
          default: 30d
          description: 'Window of historical data to return: `1d`, `7d`, `14d`, `30d`, `90d`, `180d`, `365d`, or `max`. Ignored when `from`/`to` are set. This endpoint uses `time_range` only — it does NOT accept `interval`; bucket granularity is chosen server-side based on the window size.'
          enum:
          - 1d
          - 7d
          - 14d
          - 30d
          - 90d
          - 180d
          - 365d
          - max
          examples:
          - 30d
          type: string
      - description: Start of custom date range (Unix timestamp or YYYY-MM-DD). Must be used together with `to`. Overrides `time_range` when set.
        explode: false
        in: query
        name: from
        schema:
          description: Start of custom date range (Unix timestamp or YYYY-MM-DD). Must be used together with `to`. Overrides `time_range` when set.
          examples:
          - '2025-01-01'
          type: string
      - description: End of custom date range (Unix timestamp or YYYY-MM-DD). Must be used together with `from`. Overrides `time_range` when set.
        explode: false
        in: query
        name: to
        schema:
          description: End of custom date range (Unix timestamp or YYYY-MM-DD). Must be used together with `from`. Overrides `time_range` when set.
          examples:
          - '2025-03-01'
          type: string
      - description: Quote currency like `usd`, `eur`, or `btc`
        explode: false
        in: query
        name: currency
        schema:
          default: usd
          description: Quote currency like `usd`, `eur`, or `btc`
          examples:
          - usd
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPriceResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAPIError'
          description: Error
      security:
      - AccessToken: []
      summary: Token Price History
      tags:
      - Market
  /gateway/v1/market/price-indicator:
    get:
      description: 'Returns a technical indicator for a trading pair on a given exchange and interval.


        **Modes:**

        - Set `from`/`to` for time-series

        - Omit for latest value only


        **Indicator-specific tuning** via `options` (e.g. `period:7`, `fast_period:8,slow_period:21,signal_period:5`, `period:10,stddev:1.5`).


        **Available indicators:** `rsi`, `macd`, `ema`, `sma`, `bbands`, `stoch`, `adx`, `atr`, `cci`, `obv`, `vwap`, `dmi`, `ichimoku`, `supertrend`.'
      operationId: market-price-indicator
      parameters:
      - description: Technical indicator name. Can be `rsi`, `macd`, `ema`, `sma`, `bbands`, `stoch`, `adx`, `atr`, `cci`, `obv`, `vwap`, `dmi`, `ichimoku`, or `supertrend`.
        explode: false
        in: query
        name: indicator
        required: true
        schema:
          description: Technical indicator name. Can be `rsi`, `macd`, `ema`, `sma`, `bbands`, `stoch`, `adx`, `atr`, `cci`, `obv`, `vwap`, `dmi`, `ichimoku`, or `supertrend`.
          enum:
          - rsi
          - macd
          - ema
          - sma
          - bbands
          - stoch
          - adx
          - atr
          - cci
          - obv
          - vwap
          - dmi
          - ichimoku
          - supertrend
          examples:
          - rsi
          type: string
      - description: Trading pair as `BTC/USDT` or bare symbol like `BTC`
        explode: false
        in: query
        name: symbol
        required: true
        schema:
          description: Trading pair as `BTC/USDT` or bare symbol like `BTC`
          examples:
          - BTC
          type: string
      - description: 'Candlestick interval — bucket size for each point in the indicator series: `1m`, `5m`, `15m`, `30m`, `1h`, `2h`, `4h`, `12h`, `1d`, or `1w`. This endpoint uses `interval` only; it does NOT accept `time_range`. Use `from`/`to` to bound the series.'
        explode: false
        in: query
        name: interval
        schema:
          default: 1d
          description: 'Candlestick interval — bucket size for each point in the indicator series: `1m`, `5m`, `15m`, `30m`, `1h`, `2h`, `4h`, `12h`, `1d`, or `1w`. This endpoint uses `interval` only; it does NOT accept `time_range`. Use `from`/`to` to bound the series.'
          enum:
          - 1m
          - 5m
          - 15m
          - 30m
          - 1h
          - 2h
          - 4h
          - 12h
          - 1d
          - 1w
          examples:
          - 1d
          type: string
      - description: Exchange for price data. Can be `binance`, `bybit`, `coinbase`, or `kraken`.
        explode: false
        in: query
        name: exchange
        schema:
          default: binance
          description: Exchange for price data. Can be `binance`, `bybit`, `coinbase`, or `kraken`.
          enum:
          - binance
          - bybit
          - coinbase
          - kraken
          examples:
          - binance
          type: string
      - description: Start of time range. When set, returns time-series instead of latest value. Accepts Unix seconds (`1704067200`) or date string (`2024-01-01`)
        explode: false
        in: query
        name: from
        schema:
          description: Start of time range. When set, returns time-series instead of latest value. Accepts Unix seconds (`1704067200`) or date string (`2024-01-01`)
          examples:
          - '2024-01-01'
          type: string
      - description: End of time range. Defaults to now when from is set. Accepts Unix seconds (`1706745600`) or date string (`2024-02-01`)
        explode: false
        in: query
        name: to
        schema:
          description: End of time range. Defaults to now when from is set. Accepts Unix seconds (`1706745600`) or date string (`2024-02-01`)
          examples:
          - '2024-02-01'
          type: string
      - description: 'Indicator-specific options as comma-separated key:value pairs. Available options by indicator: `period` — lookback period for rsi (default 14), sma (default 20), ema (default 20), bbands (default 20), adx (default 14), atr (default 14), cci (default 20), dmi (default 14), stoch (default 14), supertrend (default 10). `stddev` — standard deviation for bbands (default 2). `multiplier` — multiplier for supertrend (default 3). `fast_period` — MACD fast EMA (default 12). `slow_period` — MACD slow EMA (default 26). `signal_period` — MACD signal smoothing (default 9). Examples: `period:7`, `period:200`, `fast_period:8,slow_period:21,signal_period:5`, `period:10,stddev:1.5`.'
        explode: false
        in: query
        name: options
        schema:
          description: 'Indicator-specific options as comma-separated key:value pairs. Available options by indicator: `period` — lookback period for rsi (default 14), sma (default 20), ema (default 20), bbands (default 20), adx (default 14), atr (default 14), cci (default 20), dmi (default 14), stoch (default 14), supertrend (default 10). `stddev` — standard deviation for bbands (default 2). `multiplier` — multiplier for supertrend (default 3). `fast_period` — MACD fast EMA (default 12). `slow_period` — MACD slow EMA (default 26). `signal_period` — MACD signal smoothing (default 9). Examples: `period:7`, `period:200`, `fast_period:8,slow_period:21,signal_period:5`, `period:10,stddev:1.5`.'
          examples:
          - period:7
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseMarketIndicatorItem'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAPIError'
          description: Error
